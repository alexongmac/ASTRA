apiVersion: v1
kind: Pod
metadata:
  name: rds-proxy
  namespace: mysql
spec:
  restartPolicy: Never
  containers:
    - name: rds-proxy
      image: alpine/socat
      command:
        - socat
        - TCP-LISTEN:3306,fork,reuseaddr
        - TCP:astra-mysql-db.chheppac9ozc.us-east-1.rds.amazonaws.com:3306
