name: Terraform Deployment

on:
  push:
    branches: [develop, main]
    paths:
      - "*.tf"
      - "github-oidc-bootstrap/**.tf"
      - "envs/**.tfvars"
      - ".github/workflows/terraform-apply.yml"
  # "Run workflow" in the Actions tab, on the branch of the environment to fix:
  # re-applies without a push, and without applying from a laptop (which cannot
  # release the state lock - see use_lockfile in 2-provider.tf). It cannot fix
  # a morning when the 6am sweep has stripped this pipeline's own role
  # policies; 2-provider.tf describes the laptop recovery for that case.
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: read # To read repo content

jobs:
  plan:
    runs-on: ubuntu-latest

    # The reviewed plan's fingerprint, checked by the apply job (see there).
    outputs:
      plan_digest: ${{ steps.plan.outputs.digest }}

    env:
      ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    # One Terraform run at a time PER ENVIRONMENT, queued rather than failed.
    # The S3 state lock (use_lockfile in 2-provider.tf) is the real guard and
    # also covers runs outside this workflow; this queue just stops a second
    # push from failing on the lock. Each env has its own state key, so a
    # develop push and a main push never block each other.
    concurrency:
      group: terraform-state-${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # OIDC_ROLE differs per environment and isn't an Environment-scoped
      # variable here: a job's `environment:` gates it on that Environment's
      # approval rules, and plan must run unapproved so reviewers can see the
      # diff before deciding whether to approve `apply`. So each env's role
      # ARN is its own repo-level variable, selected by branch instead.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ github.ref == 'refs/heads/main' && vars.OIDC_ROLE_PRODUCTION || vars.OIDC_ROLE_DEVELOPMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      # No wrapper: it adds its own lines to stdout, which would corrupt the
      # plan text that is fingerprinted below.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend-config="key=astra/${ENVIRONMENT}.tfstate"

      - name: Terraform Validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint -f compact

      - name: Run Snyk IaC Test
        uses: snyk/actions/iac@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      # The plan file itself stays on this runner: plan files can hold secrets
      # in plain text (the IoT device key, the database password), and this
      # repository is public, so it must never be uploaded as an artifact.
      # Only a fingerprint of the readable plan - where sensitive values are
      # masked - is passed on to the apply job.
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -input=false -out=tfplan -var-file="envs/${ENVIRONMENT}.tfvars"
          terraform show -no-color tfplan > plan.txt
          echo "digest=$(sha256sum plan.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  snyk-scans:
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk to check for vulnerabilities in Terraform project
        run: snyk iac test --severity-threshold=high
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  apply:
    needs: plan
    runs-on: ubuntu-latest

    # Attaching a GitHub Environment named "production" to this job means
    # that if the repo's Settings > Environments > production has required
    # reviewers configured, this job pauses and waits for someone to click
    # Approve before running `terraform apply`. The "development" environment
    # has no reviewer requirement, so develop pushes apply immediately.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    env:
      ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    concurrency:
      group: terraform-state-${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ github.ref == 'refs/heads/main' && vars.OIDC_ROLE_PRODUCTION || vars.OIDC_ROLE_DEVELOPMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      # No wrapper: it adds its own lines to stdout, which would corrupt the
      # plan text that is fingerprinted below.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config="key=astra/${ENVIRONMENT}.tfstate"

      # Apply exactly what was reviewed. This job plans again, saves that plan,
      # and refuses to continue unless its fingerprint matches the plan job's.
      # If anything changed in between (a laptop apply, the 6am sweep, a
      # change made by hand, another run), the plans differ and nothing is
      # applied: re-run the workflow to review the new plan. When they match,
      # the saved file is applied as it is, so apply cannot do more than the
      # reviewed plan showed.
      - name: Check the plan still matches the reviewed one
        env:
          REVIEWED_DIGEST: ${{ needs.plan.outputs.plan_digest }}
        run: |
          terraform plan -input=false -out=tfplan -var-file="envs/${ENVIRONMENT}.tfvars"
          terraform show -no-color tfplan > plan.txt
          CURRENT_DIGEST="$(sha256sum plan.txt | cut -d' ' -f1)"
          if [ -z "$REVIEWED_DIGEST" ] || [ "$CURRENT_DIGEST" != "$REVIEWED_DIGEST" ]; then
            echo "::error::The plan has changed since it was reviewed, so nothing was applied. Re-run this workflow to review the new plan."
            cat plan.txt
            exit 1
          fi
          echo "Plan matches the reviewed plan ($CURRENT_DIGEST)."

      - name: Terraform Apply
        run: terraform apply -input=false tfplan
