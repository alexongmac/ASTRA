name: Terraform Deployment

on:
  push:
    branches: [develop, main]
    paths:
      - "*.tf"
      - "github-oidc-bootstrap/**.tf"
      - "envs/**.tfvars"
      - ".github/workflows/terraform-apply.yml"

permissions:
  id-token: write # Required for OIDC
  contents: read # To read repo content

jobs:
  plan:
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    # One Terraform run at a time PER ENVIRONMENT (state locking is disabled
    # in the backend, and each env has its own state key) - a develop push
    # and a main push must never block each other.
    concurrency:
      group: terraform-state-${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OIDC_ROLE differs per environment and isn't an Environment-scoped
      # variable here: a job's `environment:` gates it on that Environment's
      # approval rules, and plan must run unapproved so reviewers can see the
      # diff before deciding whether to approve `apply`. So each env's role
      # ARN is its own repo-level variable, selected by branch instead.
      # TEMPORARY: production's OIDC role doesn't exist yet (this run creates
      # it via github-oidc-bootstrap), so there's nothing for OIDC to assume
      # on main. Bootstrap with a real credential just this once, scoped to
      # main only - develop keeps using OIDC as normal. Revert afterward.
      - name: Configure AWS credentials (bootstrap, main only)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_BOOTSTRAP }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_BOOTSTRAP }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure AWS credentials (OIDC, develop only)
        if: github.ref != 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_DEVELOPMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # lambda/*.zip is gitignored (build artifacts, not source) - build them
      # here so terraform validate/plan can resolve filebase64sha256() on them.
      # build.py produces a byte-identical zip for identical source, so this
      # doesn't force a new Lambda/layer version on every CI run.
      - name: Build Lambda artifacts
        run: python3 lambda/build.py

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend-config="key=astra/${ENVIRONMENT}.tfstate"

      - name: Terraform Validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint -f compact

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: true

      # TEMPORARY: scoped to just the bootstrap module while production's
      # OIDC role doesn't exist yet - remove -target once it's created and
      # revert to a full plan/apply for the rest of the environment.
      - name: Terraform Plan
        run: terraform plan -var-file="envs/${ENVIRONMENT}.tfvars" ${{ github.ref == 'refs/heads/main' && '-target=module.github_oidc_bootstrap' || '' }}

  apply:
    needs: plan
    runs-on: ubuntu-latest

    # Attaching a GitHub Environment named "production" to this job means
    # that if the repo's Settings > Environments > production has required
    # reviewers configured, this job pauses and waits for someone to click
    # Approve before running `terraform apply`. The "development" environment
    # has no reviewer requirement, so develop pushes apply immediately.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    env:
      ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    concurrency:
      group: terraform-state-${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TEMPORARY: see matching note in the plan job above.
      - name: Configure AWS credentials (bootstrap, main only)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_BOOTSTRAP }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_BOOTSTRAP }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure AWS credentials (OIDC, develop only)
        if: github.ref != 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_DEVELOPMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Build Lambda artifacts
        run: python3 lambda/build.py

      - name: Terraform Init
        run: terraform init -backend-config="key=astra/${ENVIRONMENT}.tfstate"

      # TEMPORARY: see matching note in the plan job above.
      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file="envs/${ENVIRONMENT}.tfvars" ${{ github.ref == 'refs/heads/main' && '-target=module.github_oidc_bootstrap' || '' }}
