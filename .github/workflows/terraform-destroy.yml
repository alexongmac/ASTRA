name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - development
          - production

permissions:
  id-token: write # Required for OIDC
  contents: read # To read repo content

jobs:
  CICD:
    runs-on: ubuntu-latest

    # Same gate terraform-apply.yml puts on its apply job. Settings >
    # Environments > production has required reviewers, so a production
    # destroy pauses for an approval before anything is torn down; the
    # development environment has no rules, so dev destroys run straight
    # through. Without this key the dropdown above is the ONLY thing
    # standing between a mis-click and a destroyed production cluster -
    # destroying would be easier than applying, which is backwards.
    environment: ${{ inputs.environment }}

    env:
      ENVIRONMENT: ${{ inputs.environment }}

    concurrency:
      group: terraform-state-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'production' && vars.OIDC_ROLE_PRODUCTION || vars.OIDC_ROLE_DEVELOPMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # No `run:` step calls helm directly any more, but terraform destroy
      # below still destroys helm_release.argocd, so the provider needs it.
      # Drop this only together with 23-argocd.tf, if the kustomize migration
      # in the README is completed.
      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Update kubeconfig
        continue-on-error: true
        run: aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name "astra-eks-${ENVIRONMENT}-cluster"

      # This is the real teardown for everything ASTRA_argocd deploys, Helm
      # charts included.
      #
      # ArgoCD does NOT create Helm releases. For an Application with
      # source.chart (traefik, kyverno, kube-prometheus-stack, loki,
      # trivy-operator, promtail, cluster-autoscaler,
      # aws-load-balancer-controller) ArgoCD runs `helm template` internally
      # and applies the rendered manifests itself, so there is no release
      # secret and `helm list` never shows them - on development it lists
      # ArgoCD's own release and nothing else. Deleting the Application is
      # what removes those resources: each carries ArgoCD's
      # resources-finalizer, so the delete cascades to everything the
      # Application created.
      #
      # There used to be a "Helm uninstall ArgoCD-managed releases" step here
      # that ran `helm list | awk '$2 != "argocd"'`. Since ArgoCD's charts are
      # not releases, that filter matched nothing, the loop ran zero times and
      # the step always exited 0 - it never uninstalled anything, and
      # continue-on-error hid that it was inert. Removed rather than fixed:
      # this delete is the correct mechanism, and terraform destroy below
      # takes the cluster regardless.
      #
      # --timeout lets the finalizers actually run. Without it the step can
      # return while deletion is still in progress, and the namespace delete
      # and terraform destroy below race it.
      - name: Delete ArgoCD Applications (cascades to their resources)
        continue-on-error: true
        run: |
          kubectl delete application --all -n argocd --timeout=300s || true

      # Pinned to v3.6.2, the version 23-argocd.tf's helm_release actually
      # installs (chart 10.18.2 -> app v3.6.2). This used to reference
      # .../argo-cd/stable/manifests/install.yaml - a floating ref that
      # resolves to whatever upstream's latest release is, so it listed
      # resources that may not match what is installed and silently left the
      # rest behind. Deleting the namespace below is what actually clears
      # them, but a mismatched delete masks failures and makes this step
      # useless as a signal.
      #
      # If the kustomize migration in the README is ever completed, replace
      # this with the pinned bootstrap directory instead:
      #   kubectl delete -k ../ASTRA_argocd/bootstrap/argocd-install/ || true
      - name: Uninstall ArgoCD (best-effort)
        continue-on-error: true
        run: |
          kubectl delete -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.6.2/manifests/install.yaml || true
          kubectl delete namespace argocd || true

      - name: Terraform Init
        run: terraform init -backend-config="key=astra/${ENVIRONMENT}.tfstate"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -var-file="envs/${ENVIRONMENT}.tfvars"
