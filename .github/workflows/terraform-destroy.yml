name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - development
          - production

permissions:
  id-token: write # Required for OIDC
  contents: read # To read repo content

jobs:
  CICD:
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: ${{ inputs.environment }}

    concurrency:
      group: terraform-state-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'production' && vars.OIDC_ROLE_PRODUCTION || vars.OIDC_ROLE_DEVELOPMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Update kubeconfig
        continue-on-error: true
        run: aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name "astra-eks-${ENVIRONMENT}-cluster"

      - name: Delete ArgoCD Applications (stop self-heal before uninstalling charts)
        continue-on-error: true
        run: |
          kubectl delete application --all -n argocd || true

      # Uninstalls every release ArgoCD/ASTRA_argocd deployed, whatever it's
      # named, so this list never drifts out of sync with Applications/.
      # ArgoCD's own release lives outside ASTRA_argocd (installed by this
      # repo's helm_release.argocd), so it's excluded here and handled by
      # the dedicated "Uninstall ArgoCD" step below instead.
      - name: Helm uninstall ArgoCD-managed releases (best-effort)
        continue-on-error: true
        run: |
          helm list --all-namespaces --no-headers | awk '$2 != "argocd" {print $1, $2}' | \
          while read -r name namespace; do
            echo "Uninstalling $name in $namespace"
            helm uninstall "$name" -n "$namespace" || true
          done

      - name: Uninstall ArgoCD (best-effort)
        continue-on-error: true
        run: |
          kubectl delete -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml || true
          kubectl delete namespace argocd || true

      - name: Terraform Init
        run: terraform init -backend-config="key=astra/${ENVIRONMENT}.tfstate"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -var-file="envs/${ENVIRONMENT}.tfvars"
