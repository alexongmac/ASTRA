name: Web App Build and Deploy

on:
  push:
    branches: [develop, main]
    paths:
      - "app/**"
      - ".github/workflows/web-app-deploy.yml"
  # Lets the image be rebuilt without an app/** change. Needed when the
  # cluster's architecture moves out from under an existing image: after the
  # nodes went from t4g.large (arm64) to t3.medium (x86_64), the last
  # production image was still arm64 and every pod crash-looped with
  # "exec format error", with no app change pending to trigger a rebuild.
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC (ECR push)
  contents: read

env:
  ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
  ECR_REPOSITORY: astra-eks-${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}-app

jobs:
  # Code checks, then dependency, source and container scanning for the Next.js
  # app. The lint and type check BLOCK the deploy: build-and-push needs this job,
  # so a push that fails either one never reaches the cluster. The Snyk scans
  # are continue-on-error like the Terraform workflow's: they report findings
  # without blocking a class-project deploy.
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # npm ci needs the lockfile's exact tree; Snyk reads node_modules to
      # resolve transitive dependencies rather than guessing from the manifest.
      - name: Install dependencies
        working-directory: app
        run: npm ci

      # ESLint with the app's own config (eslint.config.mjs).
      - name: Lint
        working-directory: app
        run: npm run lint

      # Both generated type sources must exist before tsc, and neither is
      # committed: a fresh checkout fails with 22 errors without the Prisma
      # client and with "Cannot find name 'LayoutProps'" without the Next.js
      # route types. DATABASE_URL is only needed so the Prisma CLI can load
      # prisma.config.ts (as in the Dockerfile); no connection is made.
      - name: Generate types
        working-directory: app
        env:
          DATABASE_URL: mysql://build:build@127.0.0.1:3306/build
        run: |
          npx prisma generate
          npx next typegen

      - name: Type check
        working-directory: app
        run: npx tsc --noEmit

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk dependency scan
        working-directory: app
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high --all-projects

      - name: Snyk Code scan
        working-directory: app
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=high

  build-and-push:
    needs: security-scan
    # x86 runner to match the t3.medium (AL2023_x86_64_STANDARD) nodes. This
    # must stay in step with ami_type/instance_type in 12-nodes.tf: an image
    # built for the wrong architecture is rejected at pod start with "no match
    # for platform in manifest".
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}

    # Same per-environment lock pattern as terraform-apply.yml - a develop
    # push and a main push must never race each other's image tag. The branch
    # expression is repeated here rather than reusing env.ENVIRONMENT: the env
    # context is not available when concurrency is evaluated.
    concurrency:
      group: web-app-${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ github.ref == 'refs/heads/main' && vars.OIDC_ROLE_PRODUCTION || vars.OIDC_ROLE_DEVELOPMENT }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Back on an x86 runner, so the standard action's binary runs natively
      # and the manual arm64 download is no longer needed.
      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Build image
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker build -t "$IMAGE" app/
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Scans the base image's OS packages, which the npm dependency scan in
      # security-scan does not cover. Runs before the push so findings are
      # attached to the build rather than discovered after it ships.
      - name: Snyk container scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test "${{ steps.image.outputs.image }}" \
            --file=app/Dockerfile --severity-threshold=high

      - name: Push image
        run: docker push "${{ steps.image.outputs.image }}"

  update-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Mirrors terraform-apply.yml's production approval gate - a main push
    # pauses here until someone approves, so the image is never deployed to
    # production without a human looking at it first.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    steps:
      # GITHUB_TOKEN is scoped to this repo only, so writing to
      # ASTRA_argocd needs a separate PAT with contents:write on that repo.
      # ref matters: checkout defaults to the GitOps repo's default branch
      # (main), but each ArgoCD Application tracks the branch matching its
      # environment, so the image tag has to be committed there.
      - name: Checkout GitOps repo
        uses: actions/checkout@v7
        with:
          repository: alexongmac/ASTRA_argocd
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || 'develop' }}
          token: ${{ secrets.GITOPS_REPO_TOKEN }}

      - name: Install yq
        uses: mikefarah/yq@v4.54.3
        with:
          cmd: yq --version

      - name: Update image tag
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          # envs/<env>/web-app/ is raw manifests, not a Helm chart (it's our
          # own image, not a published chart), so this edits the Deployments
          # directly instead of a valuesObject.image field. The file holds both
          # the web and worker Deployments, which share one image, so this
          # selects every document rather than only the first.
          yq -i "select(.kind == \"Deployment\").spec.template.spec.containers[].image = \"${IMAGE}\"" \
            "envs/${ENVIRONMENT}/web-app/deployment.yaml"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "envs/${ENVIRONMENT}/web-app/deployment.yaml"
          git commit -m "Deploy web-app ${{ github.sha }} to ${{ env.ENVIRONMENT }}" || exit 0
          git push
