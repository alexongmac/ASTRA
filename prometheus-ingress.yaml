apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: astra-prometheus
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.kubernetes.io/hostname: astra-prom.sctp-sandbox.com
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - astra-prom.sctp-sandbox.com
      secretName: astra-prom-tls
  rules:
    - host: astra-prom.sctp-sandbox.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-prometheus
                port:
                  number: 9090
